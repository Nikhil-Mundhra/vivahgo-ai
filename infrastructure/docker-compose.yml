version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: vivahgo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vivahgo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "4567:4567"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vivahgo_db
      POSTGRES_USER: vivahgo
      POSTGRES_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "4567"
    depends_on:
      - postgres
      - redis

  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MCP_SERVER_URL: http://backend:4567/mcp
      PORT: "8000"
    depends_on:
      - backend

volumes:
  postgres_data:

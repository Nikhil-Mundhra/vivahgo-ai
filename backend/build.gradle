plugins {
    id 'java'
    id 'groovy'
    id 'application'
}

group = 'com.vivahgo'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // SparkJava HTTP server for MCP JSON-RPC routing
    implementation 'com.sparkjava:spark-core:2.9.4'

    // JSON serialization / deserialization
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    // Redis client for distributed locking (Issue #1)
    implementation 'redis.clients:jedis:5.1.2'

    // jOOQ & PostgreSQL for ACID ledger (Issue #3)
    implementation 'org.jooq:jooq:3.19.6'
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    // Spock testing framework
    testImplementation platform('org.spockframework:spock-bom:2.4-M4-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.apache.groovy:groovy:4.0.21'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mock Redis for deterministic Spock tests
    testImplementation 'com.github.fppt:jedis-mock:1.1.2'

    // In-memory SQL for isolated database tests
    testImplementation 'com.h2database:h2:2.2.224'
}

application {
    mainClass = 'com.vivahgo.backend.mcp.McpServer'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.vivahgo.backend.mcp.McpServer'
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
